# atlas-frontend.yaml
---
# 1. ConfigMap：把 nginx.conf 存到 K8s 里
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-frontend-nginx
  namespace: atlas-frontend          # 改成你的命名空间
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://atlas-svc.atlas-backend.svc.cluster.local:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

---
# 2. Deployment：运行前端容器
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-frontend
  namespace: atlas-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-frontend
  template:
    metadata:
      labels:
        app: atlas-frontend
    spec:
      containers:
        - name: atlas-frontend
          # 改成你的镜像地址
          image: registry.cn-hangzhou.aliyuncs.com/bubua12/atlas-frontend:1.1.8
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              # 把 ConfigMap 里的文件挂载到 nginx 的配置目录
              # 这会覆盖 Docker 镜像里 COPY 进去的 nginx.conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: atlas-frontend-nginx

---
# 3. Service：暴露前端服务
apiVersion: v1
kind: Service
metadata:
  name: atlas-frontend
  namespace: atlas-frontend
spec:
  type: ClusterIP        # 只在集群内部访问，配合 Ingress 使用
  selector:
    app: atlas-frontend
  ports:
    - port: 80
      targetPort: 80